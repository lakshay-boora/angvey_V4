[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "angvey"
version = "0.4.0"
description = "Angvey V4 — Your personal AI agent that thinks, decides, and delivers real automations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "lakshay-boora", email = "lakshay20.b@gmail.com" },
]
keywords = ["ai", "agent", "llm", "automation", "local-first", "ollama", "personal-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
all = ["python-telegram-bot>=21.0"]

[project.urls]
Homepage = "https://github.com/lakshay-boora/angvey_V4"
Repository = "https://github.com/lakshay-boora/angvey_V4"
Issues = "https://github.com/lakshay-boora/angvey_V4/issues"

[project.scripts]
angvey = "angvey.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/angvey"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
